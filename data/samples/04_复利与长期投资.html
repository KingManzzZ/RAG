<h1>复利与长期投资</h1>
<h2>一、复利效应</h2>
<p>复利是指投资收益再投资所产生的收益，即"利滚利"。复利公式为最终金额等于本金乘以（1 加年化收益率）的期数次方。
以年化收益率 6% 为例，本金 10 万元在 10 年后约为 17.9 万元，20 年后约为 32.1 万元，30 年后约为 57.4 万元。</p>
<h2>二、长期投资纪律</h2>
<p>长期投资的关键在于坚持定期投入、避免追涨杀跌，并控制交易成本与费率。定投是指以固定金额、固定周期买入基金的方式，
可以在市场下跌时买入更多份额，从而平滑持仓成本。</p>
